            <h2 style="font-family:var(--fonteTerciaria);font-size:24px;text-align:center"> Escolha a forma de pagamento
            </h2>
            <div class="opcoesPagamento">
                <div class="metodo" onclick="selectPagamento('pix', this)"> PIX </div>
                <div class="metodo" onclick="selectPagamento('cartao', this)"> Cartão de Crédito </div>
                <div class="metodo" onclick="selectPagamento('boleto', this)"> Boleto </div>
            </div>
            <div id="areaPix" style="display:none; text-align:center;">
                <h3 style="font-family: var(--fontePrimaria); margin-bottom:10px;">PIX</h3> <img
                    src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=Vinil%20De%20Rua%20Pagamento"
                    alt="QR Code PIX" style="border:3px solid #000; border-radius:10px; margin-bottom:10px;">
                <p style="background:#eee; padding:10px; border-radius:8px; font-family: var(--fonteNumeros);"> Chave
                    PIX: contato@vinilderua.com.br </p>
                <p style="font-weight:bold; font-size:20px; margin-top:10px;"> Total: R$
                    <?= number_format($total, 2, ',', '.') ?>
                </p>
            </div>
            <form id="formPagamento" method="POST"> <input type="hidden" id="pagamentoSelecionado" name="pagamento">
            </form> <button class="confirmarBtn" onclick="confirmarPagamento()"> Confirmar Pagamento </button>
        </div>
    </section>
    <script> function confirmarPagamento() {
            const metodo = document.getElementById("pagamentoSelecionado").value; if (!metodo) return; // Requisição assíncrona para limpar o carrinho fetch("../scripts/limparCarrinho.php", { method: "POST" }) .then(() => { if (metodo === "boleto") { window.location.href = "boletoSimu.php"; } else { window.location.href = "resumoCompra.php"; } }) .catch(err => console.error("Erro ao limpar carrinho:", err)); } </script>
    <script> function selectPagamento(tipo, el) { document.querySelectorAll('.metodo').forEach(m => m.classList.remove('selected')); el.classList.add('selected'); document.getElementById("pagamentoSelecionado").value = tipo; document.querySelector('.confirmarBtn').style.display = "block"; document.getElementById('areaPix').style.display = (tipo === 'pix') ? 'block' : 'none'; } </script>}
</body>
