<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado pela compra</title>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
            background: url(https://i.ibb.co/gbwXV7fv/BCGOBG.png);
            background-size: cover;
            background-position: center;
        }

        .agradecimento {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            justify-content: center;
        }

        .agradecimento h1 {
            font-size: 70px;
            font-family: 'Caesar Dressing', cursive;
            color: #000000;
            text-align: center;
        }

        .agradecimento h1 span {
            color: #6B6B6B;
            font-size: 82px;
        }

        .agradecimento button {
            border-radius: 3px;
            border: 1px solid #000000;
            padding: 2px 12px;
            font-family: 'Caesar Dressing', cursive;
            font-size: 20px;
            cursor: pointer;
            transition: background-color 0.1s ease-in-out, transform 0.1s ease-in-out;
        }

        .agradecimento button:hover {
            background-color: #acacac;
            color: #ffffff;
            border: 2.2px solid #ffffff;
            transform: scale(1.0);
            box-shadow: 12px 12px 12px 2px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div id="preloader">
        <img src="https://i.ibb.co/qYwvJYpw/loading.gif" alt="loading" border="0">
    </div>
    <main>
        <div class="agradecimento">
            <h1>Obrigado por comprar no <br> <span>Vinil de Rua :) </span></h1>
            <button onclick="window.open('/index.html')">Voltar para a página inicial</button>
        </div>
    </main>

    <script src="/src/assets/scripts/loading.js"></script>
</body>

</html>
