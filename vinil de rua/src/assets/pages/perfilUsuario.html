<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- FONTES USADASS -->
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
    <!-- SEPARAÇÃO -->
    <link rel="stylesheet" href="/src/assets/styles/stylePerfil.css">
    <link rel="shortcut icon" type="imagex/png" href="/src/assets/images/logoVinilDeRua.svg">
</head>

<body>

    <div id="preloader">
        <img src="https://i.ibb.co/qYwvJYpw/loading.gif" alt="loading" border="0">
    </div>

    <main>
        <div class="form-container">

            <!-- Tela de Login -->
            <div class="login-box form-box">
                <div class="logoPerfil">
                    <img src="https://i.ibb.co/sdGgmwtK/logo-Vd-RBlack.png" alt="Logo Vinil de Rua">
                    <h1>VINIL <br> DE RUA</h1>
                </div>
                <div class="infoUser">
                    <input type="text" placeholder="USUÁRIO" class="inputUser">
                    <input type="password" placeholder="SENHA" class="inputPass">
                </div>
                <div class="buttonLogin">
                    <button id="criarConta">CRIAR CONTA</button>
                    <button id="login" onclick="window.open('/index.html', '_blank')">LOGIN</button>
                </div>
                <div class="esqueceuSenha">
                    <span><a href="#" onclick="showForgot()">Esqueceu a sua senha?</a></span>
                </div>
            </div>

            <!-- Tela de Recuperar Senha -->
            <div class="forgot-box form-box">
                <div class="logoPerfil">
                    <img src="https://i.ibb.co/sdGgmwtK/logo-Vd-RBlack.png" alt="Logo Vinil de Rua">
                    <h1>VINIL <br> DE RUA</h1>
                </div>
                <div class="mensagemErro">
                    <h1>Calma! Iremos recuperar sua senha.</h1>
                </div>
                <div class="infoUser">
                    <input type="email" placeholder="EMAIL" class="inputUser">
                    <input type="password" placeholder="SENHA" class="inputUser">
                </div>

                <div class="buttonLogin">
                    <button id="recuperarSenha">ENVIAR</button>
                </div>
                <div class="esqueceuSenha">
                    <span><a href="#" onclick="showLogin()">Voltar ao login</a></span>
                </div>
            </div>

        </div>
    </main>


    <script src="/src/assets/scripts/navbar.js"></script>
    <script src="/src/assets/scripts/loading.js"></script>
    <script src="/src/assets/scripts/trocaLogin.js"></script>
</body>

</html>
