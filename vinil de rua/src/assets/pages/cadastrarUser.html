<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar</title>
    <!-- FONTES USADASS -->
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
    <!-- SEPARAÇÃO -->
    <link rel="stylesheet" href="/src/assets/styles/stylePerfil.css">
    <link rel="shortcut icon" type="imagex/png" href="/src/assets/images/logoVinilDeRua.svg">
</head>

<body>

    <div id="preloader">
        <img src="https://i.ibb.co/qYwvJYpw/loading.gif" alt="loading" border="0">
    </div>

    <main>
        <div class="form-container">


            <div class="criarConta">
                <div class="logoEmsg">

                    <div class="logoPerfil">
                        <img src="https://i.ibb.co/RknvXKX2/logo-Vinil-De-Rua-preta.png" alt="Logo Vinil de Rua">
                        <h1>VINIL <br> DE RUA</h1>
                    </div>

                    <div class="mensagemBnv">
                        <p>Seja Bem-vindo(a) ao Vinil de Rua!</p>
                    </div>

                </div>

                <div class="infoUser">

                    <label for="name">Nome de Usuário
                        <input type="name" placeholder="NOME" class="inputNome" required>
                    </label>
                    <label for="email">Email
                        <input type="email" placeholder="EMAIL" class="inputEmail" required>
                    </label>
                    <label for="password">Senha
                        <input type="password" placeholder="SENHA" class="inputSenha">
                    </label>
                    <label for="confirmPassword">Confirmar Senha
                        <input type="password" placeholder="CONFIRME A SENHA" class="inputSenha">
                    </label>
                    <label for="phone">Telefone
                        <input type="number" placeholder="TELEFONE" class="inputTelefone">
                    </label>
                    <div class="campoCom2">

                        <label for="cep">CEP
                            <input type="number" placeholder="CEP" class="inputGps">
                        </label>
                        <label for="state">Estado
                            <input type="text" placeholder="ESTADO" class="inputGps" id="estadoInput">
                        </label>

                    </div>
                    <div class="campoCom2">

                        <label for="city">Cidade
                            <input type="text" placeholder="CIDADE" class="inputGps">
                        </label>
                        <label for="address">Endereço
                            <input type="text" placeholder="ENDEREÇO" class="inputGps">
                        </label>
                    </div>

                    <div class="cadastrarUser">
                        <button id="cadastrarUser"
                            onclick="window.open('/src/assets/pages/admPageTProdutos.html', '_blank')">CADASTRAR</button>
                    </div>
    
                    <div class="voltarLogin">
                        <span><a href="#" onclick="window.open('/src/assets/pages/perfilUsuario.html', '_self')">Voltar ao
                                login</a></span>
                    </div>

                </div>

            </div>
        </div>

    </main>


    <script src="/src/assets/scripts/navbar.js"></script>
    <script src="/src/assets/scripts/loading.js"></script>
    <script src="/src/assets/scripts/trocaLogin.js"></script>
</body>

</html>
