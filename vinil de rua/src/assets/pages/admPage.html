<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADM Page</title>
    <!-- FONTES USADASS -->
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
    <!-- SEPARAÇÃO -->
    <link rel="stylesheet" href="/src/assets/styles/styleAdm.css">
    <link rel="shortcut icon" type="imagex/png" href="/src/assets/images/logoVinilDeRua.svg">
</head>

<body>

    <div id="preloader">
        <img src="https://i.ibb.co/qYwvJYpw/loading.gif" alt="loading" border="0">
    </div>

    <div class="painelAdmin">

        <!-- MENU LATERAL -->
        <aside class="menuLateral">
            <div class="areaLogo">
                <img src="img/logo.png" alt="Logo Vinil de Rua">
                <h1>Vinil de Rua</h1>
            </div>

            <nav class="menuPrincipal">
                <button class="itemMenu ativo">Dashboard</button>
                <button class="itemMenu">Adicionar Produto</button>
                <button class="itemMenu">Deletar Produto</button>
                <button class="itemMenu">Saídas</button>
            </nav>

            <div class="menuCategorias">
                <h3>Categorias</h3>
                <ul>
                    <li><span>Grime</span><span>8</span></li>
                    <li><span>Drill</span><span>8</span></li>
                    <li><span>R&B</span><span>8</span></li>
                    <li><span>90’s - Y2K</span><span>8</span></li>
                    <li><span>Boombap</span><span>8</span></li>
                </ul>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="conteudoPrincipal">

            <!-- MENU SUPERIOR -->
            <header class="menuSuperior">
                <div class="campoBusca">
                    <input type="text" placeholder="Buscar produto...">
                    <button class="btnBusca"><i class="icon-search"></i></button>
                </div>

                <div class="areaUsuario">
                    <i class="icon-user"></i>
                </div>
            </header>

            <!-- SEÇÃO DE PRODUTOS -->
            <section class="secaoProdutos">
                <h2 class="tituloSecao">Grime</h2>

                <div class="gradeProdutos">
                    <div class="cardProduto">
                        <img src="https://i.ibb.co/Fk37ghWh/recVinyl.png" alt="Capa do disco">
                        <h1>1999 - Joey Bada$$</h1>
                        <p class="precoProduto">R$ 200,00</p>
                        <div class="acoesProduto">
                            <button><i class="icon-cart"></i></button>
                            <button><i class="icon-heart"></i></button>
                        </div>
                    </div>

                    <div class="cardProduto">
                        <img src="https://i.ibb.co/Fk37ghWh/recVinyl.png" alt="Capa do disco">
                        <h1>O Rap é Compromisso - Sabotage</h1>
                        <p class="precoProduto">R$ 310,00</p>
                        <div class="acoesProduto">
                            <button><i class="icon-cart"></i></button>
                            <button><i class="icon-heart"></i></button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="/src/assets/scripts/loading.js"></script>
</body>

</html>
